<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="the onboarding loop: draft priors, preview, fit and rig, overlay check, fix and repeat, then write and reconstruct">
<title>the onboarding loop: draft priors, preview, fit and rig, overlay check, fix and repeat, then write and reconstruct</title>
<rect x="0.5" y="0.5" width="899" height="369" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="32" font-size="13" fill="#0f172a" font-weight="600">Iterate until the drawn robot sits on the real one. The solver refines good priors; it does not rescue bad ones.</text>
<rect x="20" y="50" width="200" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="32" y="72" font-size="14" fill="#7c3aed" font-weight="700">1  Draft priors</text>
<text x="32" y="91" font-size="12" fill="#475569">joints, cameras, focal:</text>
<text x="32" y="108" font-size="12" fill="#475569">recorded values first</text>
<rect x="240" y="50" width="200" height="72" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="252" y="72" font-size="14" fill="#475569" font-weight="700">2  r4r preview</text>
<text x="252" y="91" font-size="12" fill="#475569">description at the recorded</text>
<text x="252" y="108" font-size="12" fill="#475569">joints, no solve</text>
<rect x="460" y="50" width="200" height="72" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="472" y="72" font-size="14" fill="#0d9488" font-weight="700">3  r4r fit / r4r rig</text>
<text x="472" y="91" font-size="12" fill="#475569">mounts, static cameras,</text>
<text x="472" y="108" font-size="12" fill="#475569">bodies, offsets</text>
<rect x="680" y="50" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="692" y="72" font-size="14" fill="#16a34a" font-weight="700">4  r4r overlay</text>
<text x="692" y="91" font-size="12" fill="#475569">on the real robot, every</text>
<text x="692" y="108" font-size="12" fill="#475569">camera, several episodes?</text>
<path d="M220 86 L240 86" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="240,86 231.0,81.0 231.0,91.0" fill="#94a3b8"/>
<path d="M440 86 L460 86" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="460,86 451.0,81.0 451.0,91.0" fill="#94a3b8"/>
<path d="M660 86 L680 86" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="680,86 671.0,81.0 671.0,91.0" fill="#94a3b8"/>
<rect x="240" y="152" width="400" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="254" y="173" font-size="13" fill="#dc2626" font-weight="700">fix what the overlay shows</text>
<text x="254" y="192" font-size="12" fill="#475569">priors, description (copy), timing, kinematics</text>
<path d="M690 122 L690 178 L640 178" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="640,178 649.0,183.0 649.0,173.0" fill="#dc2626"/>
<text x="662" y="170" font-size="12" fill="#dc2626" font-weight="700">no</text>
<path d="M240 178 L120 178 L120 122" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="120,122 115.0,131.0 125.0,131.0" fill="#dc2626"/>
<path d="M840 122 L840 152" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="840,152 845.0,143.0 835.0,143.0" fill="#16a34a"/>
<text x="848" y="142" font-size="12" fill="#16a34a" font-weight="700">yes</text>
<rect x="705" y="152" width="175" height="52" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="717" y="174" font-size="14" fill="#4f46e5" font-weight="700">5  --write</text>
<text x="717" y="193" font-size="12" fill="#475569">then r4r reconstruct</text>
<rect x="20" y="232" width="420" height="118" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="32" y="254" font-size="14" fill="#64748b" font-weight="700">The agent (or a person) brings</text>
<text x="32" y="273" font-size="12" fill="#475569">physical and visual judgement: places cameras by eye,</text>
<text x="32" y="290" font-size="12" fill="#475569">reads overlays, checks joint signs, units, timing</text>
<text x="32" y="307" font-size="12" fill="#475569">ad-hoc scripts in its own scratchpad, not in the library</text>
<text x="32" y="324" font-size="12" fill="#475569">a standard record: priors/onboarding/&lt;embodiment&gt;.md</text>
<rect x="460" y="232" width="420" height="118" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="472" y="254" font-size="14" fill="#64748b" font-weight="700">The library brings</text>
<text x="472" y="273" font-size="12" fill="#475569">one solver for every unknown (the kinematic bundle)</text>
<text x="472" y="290" font-size="12" fill="#475569">the checks: preview, overlay, agreement between</text>
<text x="472" y="307" font-size="12" fill="#475569">groups of episodes, ground truth where a simulator</text>
<text x="472" y="324" font-size="12" fill="#475569">gives it</text>
</svg>
