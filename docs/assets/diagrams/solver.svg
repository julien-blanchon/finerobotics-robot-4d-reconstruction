<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="the kinematic bundle: Levenberg–Marquardt with points eliminated and a robust loss">
<title>the kinematic bundle: Levenberg–Marquardt with points eliminated and a robust loss</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="50" width="190" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="32" y="72" font-size="14" fill="#7c3aed" font-weight="700">Unknowns θ</text>
<text x="32" y="91" font-size="12" fill="#475569">moving mounts</text>
<text x="32" y="108" font-size="12" fill="#475569">static camera poses</text>
<text x="32" y="125" font-size="12" fill="#475569">free bodies (arm bases,</text>
<text x="32" y="142" font-size="12" fill="#475569">mobile base per frame)</text>
<text x="32" y="159" font-size="12" fill="#475569">focal, distortion</text>
<text x="32" y="176" font-size="12" fill="#475569">joint and time offsets</text>
<rect x="240" y="50" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="252" y="72" font-size="14" fill="#475569" font-weight="700">Camera poses</text>
<text x="252" y="91" font-size="12" fill="#475569">FK(qₜ + δq, t + δt) · mount</text>
<text x="252" y="108" font-size="12" fill="#475569">static: base_from_camera</text>
<rect x="240" y="140" width="190" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="252" y="162" font-size="14" fill="#475569" font-weight="700">Tracks</text>
<text x="252" y="181" font-size="12" fill="#475569">KLT + RoMa observations</text>
<rect x="465" y="50" width="205" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="477" y="72" font-size="14" fill="#0d9488" font-weight="700">Triangulate</text>
<text x="477" y="91" font-size="12" fill="#475569">each track in closed form,</text>
<text x="477" y="108" font-size="12" fill="#475569">in the world or in the link</text>
<text x="477" y="125" font-size="12" fill="#475569">it rides on: no point unknowns</text>
<rect x="465" y="150" width="205" height="50" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="477" y="172" font-size="14" fill="#0d9488" font-weight="700">Reproject → residual r</text>
<rect x="700" y="50" width="180" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="712" y="72" font-size="14" fill="#0d9488" font-weight="700">Robust LM step</text>
<text x="712" y="91" font-size="12" fill="#475569">ρ(s) = log(1 + s),</text>
<text x="712" y="108" font-size="12" fill="#475569">s = |r|² / δ²</text>
<text x="712" y="125" font-size="12" fill="#475569">(H + λ diag H) Δ = −g</text>
<text x="712" y="142" font-size="12" fill="#475569">accept if the robust</text>
<text x="712" y="159" font-size="12" fill="#475569">objective decreases</text>
<path d="M210 85 L240 85" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="240,85 231.0,80.0 231.0,90.0" fill="#94a3b8"/>
<path d="M430 85 L465 85" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="465,85 456.0,80.0 456.0,90.0" fill="#94a3b8"/>
<path d="M430 170 L448 170 L448 110 L465 110" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="465,110 456.0,105.0 456.0,115.0" fill="#94a3b8"/>
<path d="M567 138 L567 150" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="567,150 572.0,141.0 562.0,141.0" fill="#94a3b8"/>
<path d="M670 175 L700 175" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="700,175 691.0,170.0 691.0,180.0" fill="#94a3b8"/>
<path d="M790 200 L790 226 L115 226 L115 200" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="115,200 110.0,209.0 120.0,209.0" fill="#0d9488"/>
<text x="330" y="246" font-size="12" fill="#0d9488" font-weight="600">update θ and repeat; between rounds, re-attach moving tracks to links</text>
<text x="20" y="32" font-size="13" fill="#0f172a" font-weight="600">The kinematic bundle (rago/bundle.py, rago/solver.py): few unknowns, many observations</text>
<text x="20" y="275" font-size="12" fill="#0f172a" font-weight="700">variable projection</text>
<text x="170" y="275" font-size="12" fill="#475569">points are re-triangulated inside the residual, so θ is a few dozen numbers</text>
<text x="20" y="291" font-size="12" fill="#0f172a" font-weight="700">Cauchy loss</text>
<text x="170" y="291" font-size="12" fill="#475569">people, pushed objects and bad matches are down-weighted, then dropped</text>
<text x="20" y="307" font-size="12" fill="#0f172a" font-weight="700">priors</text>
<text x="170" y="307" font-size="12" fill="#475569">each unknown has a Gaussian prior: its value and range from the priors JSON</text>
<text x="20" y="323" font-size="12" fill="#0f172a" font-weight="700">Adam fallback</text>
<text x="170" y="323" font-size="12" fill="#475569">frame-scope rows (a mobile base per frame) break the compressed Jacobian</text>
</svg>
